<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palco v6 com som · Playback Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tokens. Semântica de cor: laranja = ligado/ativo · branco = armado (PRÓXIMA) · cor da seção = seção · âmbar = alerta */
:root{
  --ink:#121214;--ink0:#0b0b0d;--s1:#17171a;--s2:#1f1f23;--s3:#2b2b31;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.15);--line3:rgba(255,255,255,.28);
  --bone:#E8E8EC;--mut:#9d9da8;--dim:#686872;
  --or:#FF6B35;--or-soft:rgba(255,107,53,.12);--or-line:rgba(255,107,53,.55);--on-or:#1a0b04;
  --moss:#5B6B47;--moss-hi:#a9c47f;
  --arm:#F5F5F7;--alert:#fbbf24;
  --mute:#ef4444;--solo:#facc15;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --th:clamp(72px,9vh,88px);
  --bh:clamp(64px,8vh,82px);
  --mh:clamp(168px,20vh,208px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--bone);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;white-space:nowrap}
.app{display:flex;flex-direction:column;height:100vh;min-height:760px;min-width:1280px;user-select:none;-webkit-user-select:none}

/* ---------- Barra do app ---------- */
.appbar{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:var(--ink0);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.logo .i{width:22px;height:22px;color:var(--or)}
.logo i{color:var(--or);font-style:italic;font-weight:600}
.online{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(91,107,71,.8);background:rgba(91,107,71,.14);color:var(--moss-hi);font-size:10px;font-weight:800;letter-spacing:.14em}
.online:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--moss-hi);box-shadow:0 0 6px var(--moss-hi)}
.menu{margin-left:auto;display:flex;align-items:center;gap:2px}
.menu button{height:32px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.menu button .i{width:15px;height:15px}
.menu button:hover{color:var(--bone);background:var(--s1)}
.menu button.host{color:var(--or);box-shadow:inset 0 0 0 1px var(--or-line)}
.menu .sepm{width:1px;height:20px;background:var(--line);margin:0 6px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FF6B35,#5B6B47);box-shadow:0 0 0 2px var(--ink0),0 0 0 3px var(--line2);margin:0 4px 0 2px}

/* ---------- Transporte ---------- */
.transport{height:var(--th);flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:14px;padding:0 16px;border-bottom:1px solid var(--line)}
.t-left{display:flex;align-items:center;min-width:0}
.endmode{display:flex;flex-direction:column;gap:5px}
.segm{display:flex;height:44px;padding:3px;gap:2px;border-radius:12px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
.segm button{width:auto;min-width:62px;padding:0 12px;white-space:nowrap;border-radius:9px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mut);transition:background .15s,color .15s}
.segm button:hover{color:var(--bone)}
.segm button.on{background:var(--s3);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line2)}
.t-center{display:flex;align-items:center;gap:8px}
.tb{position:relative;width:auto;min-width:72px;padding:0 16px;height:56px;border-radius:12px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--bone);transition:background .15s,box-shadow .15s,color .15s,transform .08s}
.tb:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.tb:active,.sub:active,.chip:active,.nbtn:active,.secnav button:active,.segm button:active{transform:scale(.96)}
.tb .t{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mut);white-space:nowrap;line-height:1}
.tb.on{background:var(--or-soft);box-shadow:inset 0 0 0 1px var(--or-line);color:var(--or)}
.tb.on .t{color:var(--or)}
.tb .led{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--s3)}
.tb.on .led{background:var(--or);box-shadow:0 0 8px var(--or)}
.combo{display:flex;gap:2px}
.combo .tb{border-radius:12px 4px 4px 12px}
.sub{width:auto;min-width:40px;padding:0 10px;height:56px;border-radius:4px 12px 12px 4px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--mut);transition:color .15s,box-shadow .15s,transform .08s}
.sub:hover{color:var(--bone);box-shadow:inset 0 0 0 1px var(--line2)}
.sub .i{width:17px;height:17px}
.sub.n{font:800 16px/1 var(--mono);color:var(--bone)}
.sub.n.off{color:var(--dim)}
.vsep{width:1px;height:36px;background:var(--line);margin:0 4px}
.play{position:relative;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:var(--or);background:rgba(255,107,53,.08);box-shadow:inset 0 0 0 2px var(--or);transition:background .15s,box-shadow .1s,transform .08s;flex:none}
.play .i{width:30px;height:30px;grid-area:1/1}
.play .ic-pause{display:none}
.play.is-on{background:var(--or);color:var(--on-or);box-shadow:0 0 0 4px rgba(255,107,53,.14),0 0 24px rgba(255,107,53,.3)}
.play.is-on .ic-play{display:none}
.play.is-on .ic-pause{display:block}
.play.beat{box-shadow:0 0 0 7px rgba(255,107,53,.22),0 0 34px rgba(255,107,53,.5)}
.play .pc{grid-area:1/1;font:800 30px/1 var(--mono);display:none}
.play.precount .i{display:none!important}
.play.precount .pc{display:block}
.play:active{transform:scale(.96)}
.secnav{position:relative;display:grid;grid-template-columns:1fr 1fr;width:124px;height:56px;border-radius:12px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.secnav button{display:flex;align-items:flex-start;justify-content:center;padding-top:9px;color:var(--bone);transition:background .15s}
.secnav button+button{box-shadow:inset 1px 0 0 var(--line)}
.secnav button:hover{background:var(--s2)}
.secnav .t{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.11em;color:var(--mut);pointer-events:none}
.t-right{display:flex;justify-content:flex-end;min-width:0}

/* Aviso PRÓXIMA */
.nextpill{position:relative;display:flex;align-items:center;gap:12px;height:60px;padding:0 8px 0 14px;border-radius:14px;background:#1b1b1f;min-width:0;max-width:100%;transition:opacity .2s,transform .2s;animation:armglow 1.2s ease-in-out infinite;overflow:hidden}
.nextpill:after{content:"";position:absolute;inset:0;background:#fff;opacity:var(--fl,0);pointer-events:none}
.nextpill.idle{opacity:0;transform:translateX(10px);pointer-events:none;animation:none}
.np-t{min-width:0;display:flex;flex-direction:column}
.np-t small{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--arm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-t small .w{color:var(--mut);letter-spacing:.04em;font-weight:600}
.nextpill.warn .np-t small .w{color:var(--alert);font-weight:800}
.np-t strong{display:block;font-size:21px;font-weight:800;letter-spacing:.02em;color:var(--c,var(--arm));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;margin-top:2px}
.np-beats{display:flex;gap:4px;flex:none}
.np-beats i{width:21px;height:21px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.24);display:grid;place-items:center;font:800 11px/1 var(--mono);font-style:normal;color:transparent;transition:background .05s}
.np-beats i.l{background:var(--arm);color:var(--ink);box-shadow:0 0 12px rgba(255,255,255,.55)}
.np-wait{display:none;width:96px;flex:none;text-align:center;font-family:var(--mono);font-size:12px;font-weight:700;line-height:1.25;color:var(--arm)}
.nextpill.waiting .np-beats{display:none}
.nextpill.waiting .np-wait{display:block}
.nextpill.warn .np-wait{font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--alert)}
.np-x{width:42px;height:42px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--mut);background:var(--s2);position:relative;z-index:1}
.np-x:hover{color:var(--bone)}
@keyframes armglow{0%,100%{box-shadow:inset 0 0 0 2px var(--arm),0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:inset 0 0 0 2px var(--arm),0 0 22px 2px rgba(255,255,255,.2)}}

/* ---------- Forma de onda ---------- */
.wavewrap{flex:1.15 1 0;min-height:136px;padding:12px 16px 0;display:flex}
.wave{position:relative;flex:1;border-radius:16px;background:var(--ink0);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.wave canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cvp{clip-path:inset(0 100% 0 0)}
.blks{position:absolute;left:0;right:0;top:0;bottom:22px}
.blk{position:absolute;top:0;bottom:0;cursor:pointer;background-color:color-mix(in srgb,var(--c) 6%,transparent);box-shadow:inset -1px 0 0 rgba(0,0,0,.7);transition:background-color .15s}
.blk:hover{background-color:color-mix(in srgb,var(--c) 17%,transparent)}
.blk.cur{background-color:color-mix(in srgb,var(--c) 14%,transparent)}
.blk:after{content:"";position:absolute;inset:0;background:#fff;opacity:var(--fl,0);pointer-events:none}
.blk .lb{position:absolute;top:10px;left:7px;height:22px;padding:0 7px;border-radius:6px;background:var(--c);color:#0b0b0c;font-size:11px;font-weight:800;letter-spacing:.05em;display:flex;align-items:center;white-space:nowrap;z-index:2}
.blk.cur .lb{box-shadow:0 0 0 2px var(--ink0),0 0 0 3.5px var(--c)}
.blk .tg,.blk .lp{position:absolute;top:38px;left:7px;height:18px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:800;letter-spacing:.1em;display:none;align-items:center;gap:4px;white-space:nowrap;z-index:2}
.blk .tg{background:var(--arm);color:var(--ink)}
.blk .lp{box-shadow:inset 0 0 0 1.5px var(--bone);color:var(--bone);background:rgba(11,11,13,.8)}
.blk .lp .i{width:11px;height:11px;stroke-width:2.6}
.blk.armed{z-index:1;background-color:color-mix(in srgb,var(--c) 12%,transparent);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.1) 0 7px,transparent 7px 14px);box-shadow:inset 0 0 0 2px var(--arm);animation:stripes .9s linear infinite}
.blk.armed .tg{display:flex}
.blk.looping .lp{display:flex}
.blk.armed .lp{display:none}
.blk.looping:before{content:"";position:absolute;left:2px;right:2px;top:0;height:3px;border-radius:0 0 2px 2px;background:var(--bone)}
@keyframes stripes{to{background-position:19.8px 0}}
.arc{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.arc .bg{fill:none;stroke:rgba(0,0,0,.65);stroke-width:6;stroke-linecap:round}
.arc .dash{fill:none;stroke:var(--arm);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 6;animation:march .6s linear infinite}
.arc .dot{fill:var(--ink0);stroke:var(--arm);stroke-width:2}
.arc .head{fill:var(--arm);stroke:rgba(0,0,0,.6);stroke-width:1}
@keyframes march{to{stroke-dashoffset:-13}}
.ph{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8);z-index:4;pointer-events:none;will-change:transform}
.ph:before{content:"";position:absolute;top:0;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #fff}
.proto{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;flex:0 1 auto;padding:4px 12px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(251,191,36,.4);background:rgba(251,191,36,.07);white-space:nowrap}
.proto b{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--alert);line-height:12px}
.proto span{font-size:10px;color:var(--mut);line-height:13px}
.proto.on{box-shadow:inset 0 0 0 1px rgba(169,196,127,.45);background:rgba(91,107,71,.12)}
.proto.on b{color:var(--moss-hi)}
.demo{position:absolute;right:8px;bottom:2px;height:18px;padding:0 8px;border-radius:5px;font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--mut);box-shadow:inset 0 0 0 1px var(--line3);background:rgba(11,11,13,.9);z-index:5;border:1px dashed transparent}
.demo:hover{color:var(--bone)}

/* ---------- Botoeira de seções ---------- */
.botoeira{flex:none;display:grid;gap:8px;padding:10px 16px 0}
.sp{position:relative;height:var(--bh);border-radius:12px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;text-align:left;padding:0 10px 0 18px;display:flex;flex-direction:column;justify-content:center;gap:3px;transition:transform .08s,background-color .15s}
.sp:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.sp:active{transform:scale(.98)}
.sp:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.sp:after{content:"";position:absolute;inset:0;background:#fff;opacity:var(--fl,0);pointer-events:none}
.sp .fill{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:color-mix(in srgb,var(--c) 18%,transparent);pointer-events:none;display:none}
.sp.cur{background-color:color-mix(in srgb,var(--c) 20%,var(--s1));box-shadow:inset 0 0 0 2px var(--c)}
.sp.cur .fill{display:block}
.sp .r1{position:relative;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);white-space:nowrap}
.kbd{min-width:18px;height:18px;padding:0 4px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line2),0 1px 0 var(--line2);font:700 10px/18px var(--mono);text-align:center;color:var(--mut)}
.sp .meta{position:relative;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:13px;padding-right:30px}
.sp.cur .meta{color:var(--bone)}
.sp .nm{position:relative;font-size:16px;font-weight:800;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;line-height:19px}
.sp .tag{position:absolute;top:8px;right:8px;height:18px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:800;letter-spacing:.1em;display:none;align-items:center;gap:3px;color:#0b0b0c;z-index:1}
.sp .tag .i{width:10px;height:10px;stroke-width:3}
.sp.cur .tag.now{display:flex;background:var(--c)}
.sp.armed .tag.nx{display:flex;background:var(--arm)}
.sp.rep .tag.now{display:none}
.sp.armed{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.075) 0 7px,transparent 7px 14px);animation:stripes .9s linear infinite,armsp 1.2s ease-in-out infinite}
.sp.armed .meta{color:var(--arm);font-weight:700}
.sp .big{position:absolute;right:10px;bottom:7px;font:800 30px/1 var(--mono);color:var(--arm);text-shadow:0 0 12px rgba(255,255,255,.45);z-index:1}
@keyframes armsp{0%,100%{box-shadow:inset 0 0 0 2px var(--arm),0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:inset 0 0 0 2px var(--arm),0 0 18px 1px rgba(255,255,255,.22)}}
.sp.landed{animation:land .8s ease-out}
@keyframes land{0%{background-color:color-mix(in srgb,var(--c) 60%,var(--s1))}100%{background-color:color-mix(in srgb,var(--c) 20%,var(--s1))}}

/* ---------- Faixa do meio ---------- */
.mid{position:relative;flex:none;height:var(--mh);margin:12px 16px 0;border-radius:16px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);display:grid;grid-template-columns:minmax(214px,1.1fr) minmax(176px,.9fr) minmax(280px,1.3fr) minmax(316px,2fr) minmax(120px,.75fr) minmax(96px,.6fr);z-index:10}
.cell{position:relative;padding:12px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.cell+.cell:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:16px}
.chips{display:flex;gap:6px}
.chip{height:42px;min-width:42px;padding:0 10px;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--bone);white-space:nowrap;transition:background .15s,box-shadow .15s,color .15s,transform .08s}
.chip:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.chip .i{width:16px;height:16px}
.chip.on{background:var(--or-soft);box-shadow:inset 0 0 0 1px var(--or-line);color:var(--or)}
.chip.sm{font-size:11px;letter-spacing:.08em;font-weight:800}
/* tempo */
.c-time{border-radius:16px 0 0 16px;transition:background .2s}
.c-time .chips .chip{flex:1;min-width:0;padding:0}
.time{display:flex;align-items:baseline;gap:8px;font-size:clamp(38px,min(5vh,3.4vw),54px);font-weight:700;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.time small{font-size:14px;color:var(--mut);font-weight:600;letter-spacing:0}
.bpm{font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.bpm b{font-size:17px;font-weight:800;color:var(--bone);margin-right:5px}
.revert{display:none;height:30px;padding:0 9px;border-radius:8px;background:rgba(251,191,36,.12);box-shadow:inset 0 0 0 1px rgba(251,191,36,.5);color:var(--alert);font-size:11px;font-weight:700;gap:5px;align-items:center;white-space:nowrap}
.revert .i{width:13px;height:13px;stroke-width:2.4}
.alertb{display:none;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--alert);white-space:nowrap}
.alertb:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--alert);box-shadow:0 0 8px var(--alert);animation:blink 1.4s ease-in-out infinite}
.c-time.alt{background:linear-gradient(rgba(251,191,36,.09),rgba(251,191,36,.025))}
.c-time.alt:after{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--alert)}
.c-time.alt .bpm b{color:var(--alert)}
.c-time.alt .bpm .sig{display:none}
.c-time.alt .revert,.c-time.alt .alertb{display:inline-flex}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
/* tom */
.keybtn{display:flex;align-items:center;gap:10px;height:56px;width:100%;padding:0 10px 0 12px;border-radius:12px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:box-shadow .15s}
.keybtn:hover,.keybtn.open{box-shadow:inset 0 0 0 1px var(--line3)}
.key{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;min-width:46px}
.kinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.kinfo small{font-size:11px;color:var(--mut);white-space:nowrap}
.kinfo small b{color:var(--bone)}
.kinfo .tr{align-self:flex-start;font:800 11px/1 var(--mono);color:var(--or);padding:3px 5px;border-radius:5px;background:var(--or-soft)}
.kinfo .tr:empty{display:none}
.keybtn .i{margin-left:auto;width:16px;height:16px;color:var(--mut)}
.c-key .chips .chip{flex:1}
.keypop{position:absolute;left:8px;bottom:calc(100% + 10px);width:364px;padding:12px;border-radius:14px;background:#1d1d22;box-shadow:inset 0 0 0 1px var(--line2),0 20px 50px rgba(0,0,0,.65);display:none;z-index:40}
.keypop.open{display:block}
.kp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kp-g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.kp-g button{position:relative;height:50px;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);font-size:16px;font-weight:800;padding-bottom:6px}
.kp-g button:hover{box-shadow:inset 0 0 0 1px var(--line3)}
.kp-g button small{position:absolute;left:0;right:0;bottom:5px;font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--mut);display:none}
.kp-g button.orig small{display:block}
.kp-g button.cur{background:var(--or);color:var(--on-or);box-shadow:none}
.kp-g button.cur small{color:var(--on-or)}
/* seção atual */
.secname{font-size:clamp(22px,3vh,30px);font-weight:800;letter-spacing:.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secprog{height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.secprog i{display:block;height:100%;width:0;border-radius:2px}
.mutxt{font-size:11px;color:var(--mut)}
.stepper{display:flex;align-items:center;height:42px;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.stepper button{width:32px;height:42px;font-size:18px;font-weight:700;color:var(--bone);border-radius:10px}
.stepper button:hover{background:var(--s3)}
.stepper span{min-width:36px;text-align:center;font:700 13px var(--mono)}
.c-sec .chip.rep{padding:0 9px}
.c-sec .chip.rep.on{background:var(--arm);color:var(--ink);box-shadow:none}
/* música */
.c-song{flex-direction:row;align-items:center;gap:14px}
.art{--a:min(calc(var(--mh) - 40px),132px,8.4vw);width:var(--a);height:var(--a);flex:none;border-radius:12px;display:flex;align-items:flex-end;padding:9px;font-size:10px;font-weight:800;letter-spacing:.06em;line-height:1.2;color:rgba(255,255,255,.92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.35);transition:background .3s}
.songtx{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.songtx .lbl b{color:var(--or)}
.songtx .sl{overflow:hidden}
@media (max-width:1700px){.songtx .rname{display:none}}
.stitle{font-size:clamp(20px,2.6vh,26px);font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.sart{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songnav{display:flex;gap:6px;margin-top:9px}
.nbtn{height:44px;min-width:44px;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;gap:9px;color:var(--bone);transition:box-shadow .15s,transform .08s}
.nbtn:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.nbtn .i{width:18px;height:18px}
.nbtn.wide{flex:1;justify-content:flex-start;padding:0 10px;gap:7px;min-width:0;max-width:300px}
.nbtn.wide span{display:flex;flex-direction:column;min-width:0;text-align:left;gap:1px}
.nbtn.wide small{font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.nbtn.wide b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbtn:disabled{opacity:.35;cursor:default}
/* PAD e LETRA */
.c-big{padding:12px 10px}
.bigbtn{position:relative;width:100%;padding:0 14px;box-sizing:border-box;height:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--s2);box-shadow:inset 0 0 0 1.5px var(--or-line);color:var(--or);transition:background .15s,color .15s,transform .08s}
.bigbtn:active{transform:scale(.97)}
.bigbtn .i{width:24px;height:24px}
.bigbtn b{font-size:18px;font-weight:800;letter-spacing:.1em}
.bigbtn small{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--mut);white-space:nowrap}
.bigbtn.on{background:var(--or);color:var(--on-or);box-shadow:0 0 24px rgba(255,107,53,.25)}
.bigbtn.on small{color:rgba(26,11,4,.75)}
.bigbtn .led{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--s3)}
.bigbtn.live .led{background:var(--moss-hi);box-shadow:0 0 8px var(--moss-hi);animation:blink 1.6s ease-in-out infinite}
.bigbtn.ghost{background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);color:var(--bone)}
.bigbtn.ghost:hover{box-shadow:inset 0 0 0 1px var(--line2)}

/* ---------- Mixer ---------- */
.mixwrap{flex:1 1 0;min-height:220px;position:relative;margin:12px 16px 14px;display:flex;gap:10px}
.mixer{flex:1;min-width:0;border-radius:16px;background:#151518;box-shadow:inset 0 0 0 1px var(--line);display:flex;padding:10px 4px 8px}
.ch{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 3px;position:relative}
.ch+.ch{box-shadow:-1px 0 0 rgba(255,255,255,.035)}
.pan{height:30px;width:100%;display:flex;align-items:center;justify-content:center;gap:4px;cursor:ns-resize;touch-action:none;flex:none}
.knob{width:28px;height:28px;flex:none;overflow:visible}
.knob .kb{fill:#222228;stroke:#3a3a42;stroke-width:1}
.knob .kt{fill:none;stroke:#2e2e35;stroke-width:2.5;stroke-linecap:round}
.knob .kv{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linecap:round}
.knob .kp{fill:none;stroke:var(--bone);stroke-width:2;stroke-linecap:round}
.knob .kc{fill:none;stroke:var(--mut);stroke-width:1.5;stroke-linecap:round}
.pan:hover .knob .kb{stroke:#55555f}
.pv{font:700 10px/1 var(--mono);color:var(--bone);min-width:22px}
.pv.c{color:var(--dim)}
.fd{position:relative;flex:1;width:100%;min-height:60px;touch-action:none;cursor:ns-resize}
.fd .ticks{position:absolute;top:12px;bottom:12px;left:50%;width:30px;transform:translateX(-50%);background:repeating-linear-gradient(to bottom,rgba(255,255,255,.07) 0 1px,transparent 1px 12.5%)}
.fd .zero{position:absolute;left:50%;width:38px;height:1px;transform:translateX(-50%);top:calc(12px + (100% - 24px) * .25);background:rgba(255,255,255,.24)}
.fd .rail{position:absolute;top:12px;bottom:12px;left:50%;width:10px;transform:translateX(-50%);border-radius:5px;background:#08080a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
.fd .vu{position:absolute;left:2px;right:2px;top:2px;bottom:2px;border-radius:3px;background:linear-gradient(to top,#5B6B47 0%,#8fbf5a 52%,#d6cf4a 74%,#f59e0b 87%,#ef4444 97%);clip-path:inset(calc((1 - var(--v,0)) * 100%) 0 0 0);-webkit-mask:repeating-linear-gradient(to top,#000 0 3px,transparent 3px 4px);mask:repeating-linear-gradient(to top,#000 0 3px,transparent 3px 4px)}
.fd .pkh{position:absolute;left:2px;right:2px;height:2px;bottom:calc(2px + (100% - 6px) * var(--pk,0));background:#e8e8ec;opacity:.75}
.fd .cap{position:absolute;left:50%;top:calc(12px + (100% - 24px) * (1 - var(--f,.75)));width:44px;height:22px;transform:translate(-50%,-50%);border-radius:6px;background:linear-gradient(#36363d,#25252b);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px #3f3f47,0 4px 10px rgba(0,0,0,.6);z-index:2}
.fd .cap:before{content:"";position:absolute;left:6px;right:6px;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent)}
.fd:hover .cap,.ch.drag .cap{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px #5a5a64,0 4px 12px rgba(0,0,0,.7)}
.fd .db{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);padding:3px 6px;border-radius:5px;background:var(--bone);color:var(--ink);font-size:10px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.ch.drag .db,.master.drag .db{opacity:1}
.cb{position:absolute;left:50%;top:26px;width:30px;height:30px;border-radius:50%;background:var(--arm);color:var(--ink);font-size:15px;font-weight:800;line-height:30px;text-align:center;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .1s,transform .1s;z-index:3;pointer-events:none;box-shadow:0 0 14px rgba(255,255,255,.5)}
.ch.counting .cb{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ms{display:flex;gap:4px;width:100%;max-width:84px;flex:none}
.ms button{flex:1;height:32px;border-radius:8px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);font-size:11px;font-weight:800;color:var(--mut);transition:background .12s,color .12s}
.ms button:hover{color:var(--bone)}
.ms .m.on{background:var(--mute);color:#fff;box-shadow:0 0 12px rgba(239,68,68,.45)}
.ms .s.on{background:var(--solo);color:#171200;box-shadow:0 0 12px rgba(250,204,21,.4)}
.ch em{font-style:normal;font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--bone);flex:none;line-height:14px}
.ch.dim .pan,.ch.dim .fd,.ch.dim em{opacity:.38}
.ch.muted .cap:before{background:#4a4a52;box-shadow:none}
.master{width:116px;flex:none;border-radius:16px;background:#151518;box-shadow:inset 0 0 0 1px rgba(255,107,53,.2);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 8px}
.editch{min-height:34px;height:auto;padding:6px 10px;text-align:center;line-height:1.2;width:100%;flex:none;border-radius:8px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);font-size:9px;font-weight:800;letter-spacing:.07em;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:5px;white-space:normal;}
.editch:hover{color:var(--bone)}
.editch .i{width:12px;height:12px}
.master .fd .rail{width:20px;border-radius:6px}
.master .fd .vu{right:auto;width:6px}
.master .fd .vu.r{left:auto;right:3px}
.master .fd .vu.l{left:3px}
.master .fd .pkh{right:auto;width:6px}
.master .fd .pkh.l{left:3px}
.master .fd .pkh.r{left:auto;right:3px}
.master .fd .cap{width:56px;height:24px}
.master .fd .cap:before{background:var(--or)}
.master .fd .ticks{width:40px}
.scale{position:absolute;top:12px;bottom:12px;left:0;width:22px;pointer-events:none}
.scale span{position:absolute;right:0;transform:translateY(-50%);font:600 9px/1 var(--mono);color:var(--dim)}
.master .ms{max-width:none}
.master em{font-style:normal;font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--or);line-height:14px}

/* Painel de pads */
.padpanel{position:absolute;top:0;bottom:0;right:126px;width:520px;border-radius:16px;background:#1b1b1f;box-shadow:inset 0 0 0 1px var(--or-line),0 -12px 50px rgba(0,0,0,.6);padding:12px;display:flex;flex-direction:column;gap:10px;z-index:20;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.padpanel.open{opacity:1;visibility:visible;transform:none}
.pp-top{display:flex;align-items:center;gap:8px;flex:none}
.tabs{flex:1;display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
.tabs button{flex:1;height:34px;border-radius:8px;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--mut)}
.tabs button.on{background:var(--or-soft);color:var(--or);box-shadow:inset 0 0 0 1px var(--or-line)}
.xbtn{width:40px;height:40px;flex:none;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--mut)}
.xbtn:hover{color:var(--bone)}
.pp-body{flex:1;min-height:0;display:flex;gap:12px}
.keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:6px}
.pkey{position:relative;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;min-height:40px;transition:background .12s}
.pkey:hover{box-shadow:inset 0 0 0 1px var(--line3)}
.pkey small{position:absolute;top:4px;right:6px;font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--or);display:none}
.pkey.tom small{display:block}
.pkey.on{background:var(--or);color:var(--on-or);box-shadow:0 0 18px rgba(255,107,53,.35)}
.pkey.on small{color:var(--on-or)}
.pkey .eq{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:none;gap:2px;align-items:flex-end;height:9px}
.pkey.on .eq{display:flex}
.pkey .eq i{width:3px;height:100%;border-radius:1px;background:currentColor;transform-origin:bottom;animation:eq .7s ease-in-out infinite alternate}
.pkey .eq i:nth-child(2){animation-delay:-.25s}
.pkey .eq i:nth-child(3){animation-delay:-.5s}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.pp-side{width:178px;flex:none;display:flex;flex-direction:column;gap:8px}
.pset{height:44px;flex:none;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;text-align:left}
.pset span{display:flex;flex-direction:column;min-width:0;flex:1}
.pset small{font-size:8.5px;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.pset b{font-size:14px;font-weight:700}
.pset .i{width:17px;height:17px;color:var(--mut)}
.vol{flex:none;display:flex;flex-direction:column;gap:4px}
.vol .num{font-size:11px;font-weight:700}
.slider{position:relative;height:26px;cursor:pointer;touch-action:none}
.slider:before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--s3)}
.slider i{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--or);width:calc(var(--pv) * 100%)}
.slider b{position:absolute;top:50%;left:calc(var(--pv) * 100%);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--bone);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.pedit{height:40px;flex:none;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--mut)}
.pedit:hover{color:var(--bone)}
.pedit .i{width:14px;height:14px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;padding:10px 16px;border-radius:12px;background:#26262c;box-shadow:inset 0 0 0 1px var(--line2),0 12px 30px rgba(0,0,0,.5);font-size:13px;color:var(--bone);transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;max-width:560px;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .nextpill,.blk.armed,.sp.armed,.arc .dash,.alertb:before,.bigbtn.live .led,.pkey .eq i{animation:none!important}
  .nextpill:not(.idle){box-shadow:inset 0 0 0 2px var(--arm)}
  .sp.armed{box-shadow:inset 0 0 0 2px var(--arm)}
}
</style>
</head>

<div class="app">
  <!-- 1. Barra do app -->
  <header class="appbar">
    <div class="logo"><svg class="i" aria-hidden="true"><use href="#i-mark"/></svg>Playback <i>Studio</i></div>
    <span class="online">ONLINE</span>
    <div class="proto" id="proto" title="Protótipo descartável: toda a música é sintetizada no navegador"><b>PROTÓTIPO COM SOM SINTETIZADO · USE FONE</b><span id="protoSub">clique pra ligar o som · andamento é demo do Projeto 4</span></div>
    <nav class="menu" aria-label="Navegação do app">
      <button>REPERTÓRIOS</button><button>FAIXAS</button><button>BIBLIOTECA</button><button>EDITAR</button><button class="host">HOST</button><button>CONFIG</button>
      <button title="Volta pra tela inicial do app"><svg class="i"><use href="#i-home"/></svg>INÍCIO</button>
      <span class="sepm"></span>
      <span class="avatar" title="Usuário"></span>
      <button title="Sair da conta"><svg class="i"><use href="#i-out"/></svg>SAIR</button>
    </nav>
  </header>

  <!-- 2. Transporte -->
  <section class="transport" aria-label="Transporte">
    <div class="t-left">
      <div class="endmode">
        <span class="lbl">Fim da música</span>
        <div class="segm" id="endMode" role="radiogroup" aria-label="Fim da música">
          <button data-v="auto" role="radio" title="Ao terminar, vai pra próxima música do repertório">AUTO</button>
          <button data-v="parar" role="radio" title="Ao terminar, para">PARAR</button>
          <button data-v="fade" role="radio" title="Ao terminar, sai em fade">FADE</button>

<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
function ic(n){return '<svg class="i" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fmt(sec){sec=Math.max(0,Math.floor(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}
function fmt2(sec){var m=Math.floor(Math.max(0,sec)/60);return (m<10?'0':'')+fmt(sec);}
function hexRgb(h){var n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function rgba(h,a){var c=hexRgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lighter(h){var c=hexRgb(h).map(function(v){return Math.round(v+(255-v)*.28);});return 'rgb('+c.join(',')+')';}
function mtof(m){return 440*Math.pow(2,(m-69)/12);}

var KEYS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
/* Estrutura da música em compassos (4/4). k = arranjo usado pelo sintetizador */
var SECS=[
  {n:'INTRO',len:4,c:'#3b82f6',k:'intro'},{n:'VERSO 1',len:8,c:'#10b981',k:'verso1'},{n:'PRÉ',len:4,c:'#f59e0b',k:'pre'},
  {n:'REFRÃO',len:8,c:'#FF6B35',k:'refrao'},{n:'VERSO 2',len:8,c:'#10b981',k:'verso2'},{n:'REFRÃO',len:8,c:'#FF6B35',k:'refrao'},
  {n:'PONTE',len:8,c:'#8b5cf6',k:'ponte'},{n:'REFRÃO',len:8,c:'#FF6B35',k:'refrao'},{n:'FINAL',len:4,c:'#ec4899',k:'final'}
];
var ENERGY=[.3,.48,.66,.95,.58,.95,.78,1,.5];
var TOTAL=0; SECS.forEach(function(s){s.b=TOTAL;TOTAL+=s.len;s.e=TOTAL;});
var SONGS=[
  {t:'Eu era Órfão',a:'Ministério Exemplo',k:7,tr:-1,bpm:72,g:'linear-gradient(140deg,#FF6B35 0%,#a3401b 50%,#3e4a30 100%)'},
  {t:'Redentor',a:'Ministério Exemplo',k:2,tr:0,bpm:68,g:'linear-gradient(140deg,#3b82f6 0%,#1e3a8a 55%,#16161a 100%)'},
  {t:'Vem, Espírito',a:'Banda Exemplo',k:9,tr:0,bpm:76,g:'linear-gradient(140deg,#10b981 0%,#065f46 55%,#16161a 100%)'},
  {t:'Grande és Tu',a:'Banda Exemplo',k:4,tr:0,bpm:80,g:'linear-gradient(140deg,#8b5cf6 0%,#4c1d95 55%,#16161a 100%)'},
  {t:'Tua Graça',a:'Ministério Exemplo',k:0,tr:0,bpm:70,g:'linear-gradient(140deg,#ec4899 0%,#831843 55%,#16161a 100%)'},
  {t:'Ao Único',a:'Ministério Exemplo',k:5,tr:0,bpm:66,g:'linear-gradient(140deg,#f59e0b 0%,#92400e 55%,#16161a 100%)'}
];
/* rv = envio pro reverb */
var CH=[
  {n:'Click',c:'#FF6B35',f:.42,p:0,rv:0},{n:'Guia',c:'#f59e0b',f:.70,p:0,rv:0},
  {n:'Bateria',c:'#ef4444',f:.78,p:0,rv:.1},{n:'Percussão',c:'#f97316',f:.66,p:0,rv:.12},
  {n:'Baixo',c:'#22c55e',f:.74,p:0,rv:0},{n:'Synth Bass',c:'#16a34a',f:.60,p:0,rv:.04},
  {n:'Violão',c:'#ec4899',f:.70,p:-30,rv:.22},{n:'Guitarra 1',c:'#f43f5e',f:.72,p:-45,rv:.35},
  {n:'Guitarra 2',c:'#e11d48',f:.64,p:45,rv:.14},{n:'Teclado',c:'#8b5cf6',f:.70,p:0,rv:.25},
  {n:'Piano',c:'#a855f7',f:.74,p:0,rv:.25},{n:'Pad',c:'#6366f1',f:.56,p:0,rv:.45},
  {n:'Vocal',c:'#06b6d4',f:.76,p:0,rv:.3},{n:'Backing',c:'#0ea5e9',f:.66,p:20,rv:.45}
];
var MASTER={f:.72,m:false,vl:0,vr:0,pl:0,pr:0,tl:0,tr:0};

var st={song:0,pos:28,playing:false,armed:6,armSeq:1,repLeft:0,repN:1,loop:false,end:'auto',pre:true,preN:4,
        bpm:72,bpm0:72,key0:7,tr:-1,padKey:null,padOpen:false,padVol:.55,cntVis:0,cntMask:0,preVis:0};
var PRE_OPTS=[2,4,8];
function secAt(p){for(var i=0;i<SECS.length;i++){if(p<SECS[i].e)return i;}return SECS.length-1;}
var cur=secAt(st.pos);
var L={};
function setTxt(el,k,v){if(L[k]!==v){L[k]=v;el.textContent=v;}}

/* =====================================================================
   ÁUDIO: grafo do mixer (um canal real por canal da tela)
   ===================================================================== */
var AC=null,NOISE=null,ABUF=null,mixBus,comp,mGain,mMute,anL,anR,rvIn,PP={bus:null,v:null,key:null},sess=null;
function dbOf(v){return v<.02?-Infinity:(v>=.75?(v-.75)/.25*6:40*Math.log10(v/.75));}
function dbGain(v){var d=dbOf(v);return d===-Infinity?0:Math.pow(10,d/20);}
function filt(type,f,q){var b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!=null)b.Q.value=q;return b;}
function makeIR(sec){
  var sr=AC.sampleRate,len=Math.floor(sr*sec),b=AC.createBuffer(2,len,sr);
  for(var c=0;c<2;c++){var d=b.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
  return b;
}
function distCurve(k){var n=2048,c=new Float32Array(n);for(var i=0;i<n;i++){var x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}return c;}
function buildAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  var sr=AC.sampleRate,len=sr*2;NOISE=AC.createBuffer(1,len,sr);
  var nd=NOISE.getChannelData(0);for(var i=0;i<len;i++)nd[i]=Math.random()*2-1;
  ABUF=new Float32Array(2048);
  mixBus=AC.createGain();mixBus.gain.value=.8;
  comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=3.5;comp.attack.value=.005;comp.release.value=.2;
  mGain=AC.createGain();mMute=AC.createGain();
  mixBus.connect(comp);comp.connect(mGain);mGain.connect(mMute);mMute.connect(AC.destination);
  var sp=AC.createChannelSplitter(2);mMute.connect(sp);
  anL=AC.createAnalyser();anR=AC.createAnalyser();anL.fftSize=anR.fftSize=2048;sp.connect(anL,0);sp.connect(anR,1);
  /* reverb */
  rvIn=AC.createGain();var pre=AC.createDelay(.1);pre.delayTime.value=.02;
  var cv=AC.createConvolver();cv.buffer=makeIR(2.4);var rvLp=filt('lowpass',5200,.5),rvOut=AC.createGain();rvOut.gain.value=.9;
  rvIn.connect(pre);pre.connect(cv);cv.connect(rvLp);rvLp.connect(rvOut);rvOut.connect(mixBus);
  /* canais */
  CH.forEach(function(c,i){
    c.inp=AC.createGain();c.fdN=AC.createGain();c.muN=AC.createGain();c.panN=AC.createStereoPanner();
    c.an=AC.createAnalyser();c.an.fftSize=2048;c.snd=AC.createGain();c.snd.gain.value=c.rv;
    var head=c.inp;
    if(c.n==='Guitarra 1'){ /* delay de colcheia pontuada */
      var dl=AC.createDelay(2),fb=AC.createGain(),wet=AC.createGain(),dlp=filt('lowpass',2600,.5);
      dl.delayTime.value=45/st.bpm;fb.gain.value=.38;wet.gain.value=.42;
      c.inp.connect(dl);dl.connect(dlp);dlp.connect(fb);fb.connect(dl);dlp.connect(wet);wet.connect(c.fdN);c.dly=dl;
    }
    if(c.n==='Guitarra 2'){ /* drive */
      var ws=AC.createWaveShaper();ws.curve=distCurve(7);ws.oversample='2x';
      var cab=filt('lowpass',3000,.7),hp=filt('highpass',110,.7),pg=AC.createGain();pg.gain.value=.32;
      c.inp.connect(ws);ws.connect(hp);hp.connect(cab);cab.connect(pg);head=pg;
    }
    head.connect(c.fdN);c.fdN.connect(c.muN);c.muN.connect(c.panN);c.panN.connect(mixBus);
    c.panN.connect(c.an);c.panN.connect(c.snd);c.snd.connect(rvIn);
  });
  /* pads do painel (som próprio, fora da VS) */
  PP.bus=AC.createGain();PP.bus.gain.value=st.padVol;PP.bus.connect(mixBus);
  var ps=AC.createGain();ps.gain.value=.5;PP.bus.connect(ps);ps.connect(rvIn);
  applyAll();
}
function applyAll(){
  if(!AC)return;var now=AC.currentTime;
  CH.forEach(function(c){c.fdN.gain.setValueAtTime(dbGain(c.f),now);c.panN.pan.setValueAtTime(c.p/100,now);});
  applyMS();mGain.gain.setValueAtTime(dbGain(MASTER.f),now);mMute.gain.setValueAtTime(MASTER.m?0:1,now);
}
function applyMS(){
  if(!AC)return;var any=CH.some(function(c){return c.s;}),now=AC.currentTime;
  CH.forEach(function(c){c.muN.gain.setTargetAtTime((c.m||(any&&!c.s))?0:1,now,.008);});
}
function ensureAudio(){
  if(!AC){try{buildAudio();}catch(err){console.error('Falha ao iniciar o áudio:',err);return;}}
  if(AC.state!=='running')AC.resume();
  setProto();
}
document.addEventListener('pointerdown',ensureAudio,true);
document.addEventListener('keydown',ensureAudio,true);

/* Sessão: tudo que a VS toca passa por um barramento por canal; pausar corta a sessão inteira */
function newSession(){
  var s={bus:CH.map(function(c){var g=AC.createGain();g.connect(c.inp);return g;}),srcs:new Set()};
  sess=s;return s;
}
function dropSession(hard){
  var s=sess;sess=null;if(!s)return;var now=AC.currentTime;
  if(hard){
    s.bus.forEach(function(g){g.gain.cancelScheduledValues(now);g.gain.setValueAtTime(g.gain.value,now);g.gain.linearRampToValueAtTime(0,now+.04);});
    s.srcs.forEach(function(o){try{o.stop(now+.06);}catch(e){}});
  }
  setTimeout(function(){s.bus.forEach(function(g){g.disconnect();});},hard?400:8000);
}
function B(i){return sess.bus[i];}
function track(src){var s=sess;if(!s)return;s.srcs.add(src);src.onended=function(){s.srcs.delete(src);};}
function osc(type,f,t,end){var o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(end);track(o);return o;}
function noise(t,dur,dest){var s=AC.createBufferSource();s.buffer=NOISE;s.connect(dest);s.start(t,Math.random()*Math.max(0,1.9-dur),dur+.03);track(s);return s;}
function perc(t,peak,dec){var g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.002);g.gain.exponentialRampToValueAtTime(.0003,t+dec);return g;}

/* ---------- Vozes ---------- */
function vClick(t,acc){var o=osc('sine',acc?1760:1245,t,t+.06),g=perc(t,acc?.56:.36,.035);o.connect(g);g.connect(B(0));}
/* Contagem: bipe mais longo, mais forte e com outro timbre (claramente diferente do click) */
function vCount(t,first){
  var f=first?1319:988,end=t+.22,o1=osc('triangle',f,t,end),o2=osc('square',f*2,t,end),g2=AC.createGain(),g=AC.createGain(),lp=filt('lowpass',5200,.7),pk=first?.85:.68;
  g2.gain.value=.1;o1.connect(g);o2.connect(g2);g2.connect(g);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+.004);g.gain.setValueAtTime(pk,t+.075);g.gain.exponentialRampToValueAtTime(.0005,t+.19);
  g.connect(lp);lp.connect(B(0));
}
function vGuide(t){[[196,.38],[98,.22]].forEach(function(h){var o=osc('sine',h[0],t,t+.28),g=perc(t,h[1],.24);o.connect(g);g.connect(B(1));});}
function vKick(t,v){var o=osc('sine',150,t,t+.5),g=perc(t,.4*v,.42);o.frequency.exponentialRampToValueAtTime(44,t+.12);o.connect(g);g.connect(B(2));}
function vSnare(t,v){var hp=filt('highpass',1300,.7),g=perc(t,.26*v,.19);noise(t,.22,hp);hp.connect(g);g.connect(B(2));var o=osc('triangle',188,t,t+.14),g2=perc(t,.15*v,.09);o.connect(g2);g2.connect(B(2));}

/* ---------- Arranjo: louvor pop, 72 BPM, 4/4, um acorde por compasso ---------- */

         [2,2,5,2],[2,4,4,2],[2,6,5,2],[2,8,9,6],[2,14,7,2],[3,0,7,4],[3,4,5,2],[3,6,4,2],[3,8,2,8]],
  pre:[[0,0,5,4],[0,4,7,4],[0,8,9,8],[1,0,7,4],[1,4,9,4],[1,8,11,8],[2,0,9,4],[2,4,11,4],[2,8,12,8],[3,0,11,4],[3,4,12,4],[3,8,14,4],[3,12,11,4]],

function keyPC(){return ((st.key0+st.tr)%12+12)%12;}

function playStep(si,bis,step,t,sd,resume){
  var s=SECS[si],k=s.k,A=ARR[k],P=PROG[k],cd=P[bis%P.length],kp=keyPC(),n=(kp+cd[0])%12,third=cd[1]?3:4,bar=sd*16,rem=(16-step)*sd;

  if(A.bass==='v'){if(step===0)vBass(t,bassM,sd*7.5,1);if(step===8)vBass(t,bassM,sd*5.5,.9);if(step===14)vBass(t,bassM+7,sd*1.6,.7);}

  /* Teclado */
  if(A.keys&&(step===0||step===8))voic.forEach(function(m){vRhodes(t,m,sd*7.5,1);});

/* =====================================================================
   AGENDADOR com lookahead: agenda cada 16 avo ~120 ms à frente no relógio do AudioContext
   ===================================================================== */
var Q=[],VIS=null,SCH={timer:null,on:false,next:0,bar:0,step:0,resume:false,pj:null,cntFirst:null,fading:false};
function schedTick(){
  if(!SCH.on||!AC||!sess)return;
  var ahead=AC.currentTime+(document.hidden?1.5:.12),guard=0;
  while(SCH.on&&SCH.next<ahead&&guard++<400)scheduleStep();
}
function restoreFade(at){
  if(!SCH.fading||!sess)return;SCH.fading=false;
  sess.bus.forEach(function(g){if(g.gain.cancelAndHoldAtTime)g.gain.cancelAndHoldAtTime(at);else g.gain.cancelScheduledValues(at);g.gain.setValueAtTime(1,at);});
}
function scheduleStep(){
  var t=SCH.next,sd=15/st.bpm,bar=SCH.bar,step=SCH.step,si=secAt(bar),s=SECS[si],bis=bar-s.b;
  var e={t:t,pos:bar+step/16,sd:sd,step:step};
  if(SCH.pj){e.jump=SCH.pj;SCH.pj=null;}
  if(step===0)SCH.cntFirst=null;
  var counting=(bis===s.len-1)&&st.armed!==null;
  if(step%4===0){
    var bn=step/4;
    if(counting){
      vCount(t,bn===0);e.cnt=bn+1;
      if(!SCH.cntFirst)SCH.cntFirst={t:t,beat:bn+1};
      console.log('[CONTAGEM] tempo '+(bn+1)+' no click em t='+t.toFixed(4)+'s ('+((t-AC.currentTime)*1000).toFixed(0)+' ms antes de soar)');
    }else vClick(t,bn===0);
  }
  playStep(si,bis,step,t,sd,SCH.resume);
  if(st.end==='fade'&&step===0&&bar===TOTAL-2&&!st.loop&&st.armed===null&&sess){
    SCH.fading=true;var fd=sd*32;sess.bus.forEach(function(g){g.gain.setValueAtTime(1,t);g.gain.linearRampToValueAtTime(.0001,t+fd);});
  }
  SCH.resume=false;Q.push(e);
  SCH.next=t+sd;step++;
  if(step===16){
    step=0;bar++;
    if(bar>=s.e){
      if(st.armed!==null){
        var tg=st.armed,beat=60/st.bpm,cf=SCH.cntFirst;
        SCH.pj={target:tg,seq:st.armSeq,keep:(tg===si&&st.repLeft>1),t:SCH.next};
        restoreFade(SCH.next);
        console.log('[PULO] agendado: '+s.n+' → '+SECS[tg].n+' no tempo 1 em t='+SCH.next.toFixed(4)+'s, '+((SCH.next-AC.currentTime)*1000).toFixed(0)+' ms antes de soar'+
          (cf?(' · contagem começou no tempo '+cf.beat+' em t='+cf.t.toFixed(4)+'s · distância = '+((SCH.next-cf.t)/beat).toFixed(4)+' tempos (esperado '+(5-cf.beat)+')'):' · sem contagem (armado tarde demais)'));
        bar=SECS[tg].b;
      }else if(st.loop){bar=s.b;restoreFade(SCH.next);}
      else if(bar>=TOTAL){Q.push({t:SCH.next,pos:TOTAL-0.0001,sd:0,step:-1,end:true});SCH.on=false;}
    }
  }
  SCH.bar=bar;SCH.step=step;
}
function startPlayback(pos,withPre){
  if(!AC)return;
  if(st.playing)stopPlayback(true);
  var stepIdx=Math.floor(pos*16+1e-6);if(stepIdx>=TOTAL*16||stepIdx<0)stepIdx=0;
  SCH.bar=Math.floor(stepIdx/16);SCH.step=stepIdx%16;st.pos=SCH.bar+SCH.step/16;
  newSession();Q=[];VIS=null;SCH.fading=false;SCH.pj=null;SCH.cntFirst=null;
  var t=AC.currentTime+.08,beat=60/st.bpm;
  if(withPre){for(var i=0;i<st.preN;i++){var tt=t+i*beat;vCount(tt,i===0);Q.push({t:tt,pre:i+1,pos:st.pos,sd:0});}t+=st.preN*beat;}
  SCH.next=t;SCH.resume=true;SCH.on=true;st.playing=true;st.cntVis=0;st.cntMask=0;st.preVis=0;
  clearInterval(SCH.timer);SCH.timer=setInterval(schedTick,25);schedTick();
  syncPlay();
}
function stopPlayback(hard){
  clearInterval(SCH.timer);SCH.timer=null;SCH.on=false;st.playing=false;Q=[];VIS=null;
  st.cntVis=0;st.cntMask=0;st.preVis=0;
  if(AC)dropSession(hard);
  syncPlay();
}
function onEntry(e){
  st.preVis=e.pre||0;
  if(e.step===0){st.cntMask=0;st.cntVis=0;}
  if(e.cnt){st.cntMask|=1<<(e.cnt-1);st.cntVis=e.cnt;}
  if(e.jump)applyJump(e.jump);
  if(e.end)songEndVis();
}
function applyJump(j){
  if(st.armSeq===j.seq){if(j.keep)st.repLeft--;else{st.armed=null;st.repLeft=0;}}
  console.log('[PULO] tocou: entrou '+SECS[j.target].n+' em t='+j.t.toFixed(4)+'s');
  sync();land(j.target);
}
function songEndVis(){
  stopPlayback(false);st.pos=TOTAL-0.001;
  if(st.end==='auto'&&st.song<SONGS.length-1){goSong(st.song+1,true);toast('AUTO: entrou a próxima música do repertório');}
  sync();
}

/* ---------- Pads do painel: nota contínua no tom escolhido ---------- */
function padTone(k){
  if(!AC||PP.key===k)return;PP.key=k;
  var now=AC.currentTime;
  if(PP.v){var old=PP.v;old.g.gain.cancelScheduledValues(now);old.g.gain.setValueAtTime(old.g.gain.value,now);old.g.gain.linearRampToValueAtTime(0,now+1.2);old.o.forEach(function(o){o.stop(now+1.3);});PP.v=null;}
  if(k===null)return;

  a.fillStyle='rgba(255,255,255,.025)';a.fillRect(0,Hb,W,RB);

keyPop.addEventListener('click',function(e){e.stopPropagation();});
document.addEventListener('click',closeKeyPop);
$('kDn').onclick=function(){st.tr=clamp(st.tr-1,-6,6);syncKey();};
$('kUp').onclick=function(){st.tr=clamp(st.tr+1,-6,6);syncKey();};
$('kOrig').onclick=function(){st.tr=0;syncKey();};

/* ---------- Seção atual: repetir ---------- */
$('repBtn').onclick=function(){arm(cur,st.repN);};
$('repDn').onclick=function(){st.repN=clamp(st.repN-1,1,8);if(st.armed===cur)st.repLeft=st.repN;sync();};
$('repUp').onclick=function(){st.repN=clamp(st.repN+1,1,8);if(st.armed===cur)st.repLeft=st.repN;sync();};

/* ---------- Música ---------- */
function syncSong(){
  var S=SONGS[st.song],N=SONGS[st.song+1];
  $('sTitle').textContent=S.t;$('sArt').textContent=S.a;$('sPos').textContent='Música '+(st.song+1)+' de '+SONGS.length;
  $('art').style.background=S.g;$('artT').textContent=S.t.toUpperCase();
  $('sNext').textContent=N?N.t:'Fim do repertório';
  $('songPrev').disabled=st.song===0;$('songNext').disabled=!N;
}
function goSong(i,autoplay){
  if(i<0||i>=SONGS.length)return;
  if(st.playing)stopPlayback(true);
  var S=SONGS[i];
  st.song=i;st.bpm=st.bpm0=S.bpm;st.key0=S.k;st.tr=S.tr;st.pos=0;st.armSeq++;st.armed=null;st.repLeft=0;
  syncSong();syncKey();syncBpm();sync();
  if(autoplay&&AC)startPlayback(0,st.pre);
  syncPlay();
}
$('songPrev').onclick=function(){goSong(st.song-1,false);};
$('songNext').onclick=function(){goSong(st.song+1,false);};

/* ---------- PAD e LETRA ---------- */
var padPanel=$('padPanel'),padBtn=$('padBtn'),padKeys=$('padKeys');
KEYS.forEach(function(k,i){
  var b=document.createElement('button');b.className='pkey';
  b.innerHTML=k+'<small>TOM</small><span class="eq"><i></i><i></i><i></i></span>';
  b.onclick=function(){ensureAudio();st.padKey=st.padKey===i?null:i;syncPad();};
  padKeys.appendChild(b);
});
function syncPad(){
  var k=curKey();
  for(var i=0;i<12;i++){padKeys.children[i].classList.toggle('on',st.padKey===i);padKeys.children[i].classList.toggle('tom',i===k);}
  padPanel.classList.toggle('open',st.padOpen);padPanel.setAttribute('aria-hidden',String(!st.padOpen));
  padBtn.classList.toggle('on',st.padOpen);padBtn.setAttribute('aria-pressed',String(st.padOpen));
  padBtn.classList.toggle('live',st.padKey!==null);
  $('padSub').textContent=st.padKey!==null?'tocando '+KEYS[st.padKey]:'parado';
  padTone(st.padKey);
}
function togglePads(force){st.padOpen=typeof force==='boolean'?force:!st.padOpen;syncPad();}
padBtn.onclick=function(){togglePads();};
$('padClose').onclick=function(){togglePads(false);};
var tabs=$('padTabs').children;
for(var t=0;t<tabs.length;t++)tabs[t].onclick=function(){for(var j=0;j<tabs.length;j++)tabs[j].classList.toggle('on',tabs[j]===this);if(this.textContent!=='PADS')toast(this.textContent+': mesmo conteúdo do app (o protótipo toca só PADS)');};
$('pSet').onclick=function(){toast('Escolhe o conjunto de pads na nuvem (já existe no app)');};
$('pEdit').onclick=function(){toast('Abre a edição dos pads (já existe no app)');};
var pVol=$('pVol');
(function(){
  var id=null;
  function setv(e){var r=pVol.getBoundingClientRect();st.padVol=clamp((e.clientX-r.left)/r.width,0,1);pVol.style.setProperty('--pv',st.padVol.toFixed(3));$('pVolT').textContent=Math.round(st.padVol*100)+'%';if(AC)PP.bus.gain.setTargetAtTime(st.padVol,AC.currentTime,.03);}
  pVol.addEventListener('pointerdown',function(e){id=e.pointerId;pVol.setPointerCapture(id);setv(e);});
  pVol.addEventListener('pointermove',function(e){if(e.pointerId===id)setv(e);});
  pVol.addEventListener('pointerup',function(){id=null;});pVol.addEventListener('pointercancel',function(){id=null;});
})();
$('lyrBtn').onclick=function(){toast('LETRA abre o teleprompter (tela que já existe no app)');};
$('editCh').onclick=function(){toast('EDITAR CANAIS abre a edição de canais (já existe no app)');};

/* ---------- Aviso do protótipo, demo e atalhos ---------- */
function setProto(){
  var on=!!(AC&&AC.state!=='closed');
  $('proto').classList.toggle('on',on);
  $('protoSub').textContent=on?'som ligado · andamento é demo do Projeto 4':'clique pra ligar o som · andamento é demo do Projeto 4';
}
$('demoFF').onclick=function(){
  ensureAudio();if(!AC)return;
  var s=SECS[cur],p=Math.max(st.pos,s.e-1.5);p=Math.floor(p*4)/4;
  startPlayback(p,false);
};
var toastT=null;
function toast(msg){var tt=$('toast');tt.textContent=msg;tt.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){tt.classList.remove('show');},2800);}
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.code==='Space'){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();togglePlay();return;}
  var m=/^Digit([1-9])$/.exec(e.code);
  if(m){var i=+m[1]-1;if(i<SECS.length)arm(i,1);return;}
  if(e.key==='Escape'){if(keyPop.classList.contains('open'))closeKeyPop();else if(st.padOpen)togglePads(false);else cancelArm();return;}
  if(e.key==='ArrowLeft'){e.preventDefault();prevSec();return;}
  if(e.key==='ArrowRight'){e.preventDefault();nextSec();return;}
  if(e.key==='l'||e.key==='L'){toggleLoop();}
});

/* ---------- Início ---------- */
syncSong();syncEnd();syncPre();syncMS();syncKey();syncPlay();setProto();
buildWave();sync();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(buildWave);
var rz=null;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(buildWave,60);});
window.PS_DEBUG={st:st,CH:CH,SECS:SECS,ac:function(){return AC;},start:startPlayback,arm:arm};
requestAnimationFrame(loop);
})();
</script>
</body>
