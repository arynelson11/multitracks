appId: com.playbackstudio.app
productName: Playback Studio
directories:
  output: release
  buildResources: build
# Onde o app procura novas versões (embute app-update.yml no pacote).
# O electron-updater lê o latest.yml / latest-mac.yml publicado no Release.
publish:
  provider: github
  owner: arynelson11
  repo: multitracks
# Empacota só o que o app precisa: o renderer (dist) e o main/preload (dist-electron).
files:
  - dist/**/*
  - dist-electron/**/*
# Deep link protocol: playbackstudio://
# Permite que o app receba callbacks de OAuth e outros links profundos.
protocols:
  - name: Playback Studio
    schemes:
      - playbackstudio
mac:
  category: public.app-category.music
  icon: build/icon.icns
  target:
    # Dois instaladores: Intel (x64) e Apple Silicon (arm64).
    - target: dmg
      arch:
        - x64
        - arm64
  # Nome fixo por arquitetura pra os links do GitHub Releases serem estáveis.
  artifactName: Playback-Studio-mac-${arch}.${ext}
  # Fase 0: sem certificado Developer ID (pago) nem notarização.
  # Assinatura ad-hoc (grátis) evita o erro "app está danificado" no Apple Silicon,
  # trocando por "desenvolvedor não identificado" (contornável sem terminal em boa
  # parte dos casos). hardenedRuntime false porque sem notarização ele não ajuda em
  # nada e pode travar o app sem os entitlements certos. Assinar com Developer ID
  # de verdade quando o orçamento permitir.
  identity: "-"
  hardenedRuntime: false
win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: Playback-Studio-win.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
